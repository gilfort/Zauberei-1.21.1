plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude development only resources from finalized outputs.
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

// Ars Nouveau compat is excluded from compilation until Ars Nouveau has a 26.x release.
// Re-enable: remove this block and uncomment the Ars parts in build.gradle, neoforge.mods.toml,
// Zauberei and ZaubereiCreativeModeTabs.
sourceSets.main.java {
    exclude 'com/gilfort/zauberei/compat/**'
    exclude 'com/gilfort/zauberei/item/armor/MagicclothArmorItemArs.java'
}

repositories {
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup 'com.geckolib'
        }
    }
    // Ars Nouveau (optional) — re-enable together with the compat code once a 26.x release exists.
    // maven {
    //     name = 'BlameJared'
    //     url = 'https://maven.blamejared.com'
    //     content {
    //         includeGroup 'com.hollingsworth.ars_nouveau'
    //     }
    // }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.3, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    // GeckoLib injects GeoRenderState into vanilla render states at runtime (mixin); this copy of its
    // META-INF/interface_injections.json makes that visible to the compiler. Update it with GeckoLib.
    interfaceInjectionData {
        from(file('gradle/geckolib_interface_injections.json'))
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            // Own game directories per run (runs/client, runs/server, runs/data); the old run/ folder
            // belongs to the 1.21.1 dev setup and contains mods that do not load on 26.3.
            gameDirectory = project.file("runs/${it.name}")
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Dependencies in 'localRuntime' are present in dev runs but not published as dependencies of the mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "com.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"

    // Ars Nouveau – optional, compile-time only. No 26.x release yet.
    // compileOnly "com.hollingsworth.ars_nouveau:ars_nouveau-${minecraft_version}:${ars_nouveau_version}"
}

// Expands the properties below in src/main/templates (neoforge.mods.toml).
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            geckolib_version       : geckolib_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
