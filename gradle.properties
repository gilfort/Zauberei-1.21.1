# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Environment Properties
# NeoForge versions: https://projects.neoforged.net/neoforged/neoforge
minecraft_version=26.3
minecraft_version_range=[26.3]
neo_version=26.3.0.70-beta

## Dependencies
# GeckoLib (required): maven group com.geckolib since the 26.x versions
geckolib_version=5.5.7
# Ars Nouveau (optional) has no 26.x release yet; the compat code is commented out until it does.
# ars_nouveau_version=

## Mod Properties
mod_id=zauberei
mod_name=Zauberei
mod_license=All Rights Reserved
mod_version=2.0.0
mod_group_id=com.gilfort.zauberei
mod_authors=Gilfort
mod_description=Zauberei adds a magical school (the Witchwood School) and the Magiccloth school uniform.
